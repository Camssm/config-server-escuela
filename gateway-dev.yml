server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # RUTA SECURITY (Pública)
        - id: ms-security
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # RUTAS PROTEGIDAS
        - id: ms-cursos
          uri: lb://MS-CURSOS
          predicates:
            - Path=/api/cursos/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: ms-alumnos
          uri: lb://MS-ALUMNOS
          predicates:
            - Path=/api/alumnos/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: ms-administracion
          uri: lb://MS-ADMINISTRACION
          predicates:
            - Path=/api/administracion/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    urls:
      - name: ms-security
        url: /auth/v3/api-docs
      - name: ms-alumnos
        url: /api/alumnos/v3/api-docs
      - name: ms-cursos
        url: /api/cursos/v3/api-docs
      - name: ms-administracion
        url: /api/administracion/v3/api-docs
  enable-native-support: true
  api-docs:
    enabled: true
