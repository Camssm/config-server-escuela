server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: cursos
          uri: lb://MS-CURSOS
          predicates:
            - Path=/api/cursos/**

        - id: alumnos
          uri: lb://MS-ALUMNOS
          predicates:
            - Path=/api/alumnos/**

        - id: administracion
          uri: lb://MS-ADMINISTRACION
          predicates:
            - Path=/api/administracion/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls[0]:
      name: Alumnos
      url: /api/alumnos/v3/api-docs
    urls[1]:
      name: Cursos
      url: /api/cursos/v3/api-docs
    urls[2]:
      name: Administracion
      url: /api/administracion/v3/api-docs
