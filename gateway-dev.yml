server:
  port: 8080

spring:
  cloud:
    gateway:

      discovery:
        locator:
          enabled: true

      globalcors:
        add-to-simple-url-handler-mapping: true

        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            allowedHeaders:
              - "*"

            allowCredentials: true

      default-filters:
        - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}

      routes:

        - id: ms-security-docs
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs

        - id: ms-alumnos-docs
          uri: lb://MS-ALUMNOS
          predicates:
            - Path=/api/alumnos/v3/api-docs
          filters:
            - RewritePath=/api/alumnos/v3/api-docs, /v3/api-docs

        - id: ms-cursos-docs
          uri: lb://MS-CURSOS
          predicates:
            - Path=/api/cursos/v3/api-docs
          filters:
            - RewritePath=/api/cursos/v3/api-docs, /v3/api-docs

        - id: ms-administracion-docs
          uri: lb://MS-ADMINISTRACION
          predicates:
            - Path=/api/administracion/v3/api-docs
          filters:
            - RewritePath=/api/administracion/v3/api-docs, /v3/api-docs

        - id: ms-security
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/auth/**

        - id: ms-alumnos
          uri: lb://MS-ALUMNOS
          predicates:
            - Path=/api/alumnos/**
          filters:
            - AuthenticationFilter

        - id: ms-cursos
          uri: lb://MS-CURSOS
          predicates:
            - Path=/api/cursos/**
          filters:
            - AuthenticationFilter

        - id: ms-administracion
          uri: lb://MS-ADMINISTRACION
          predicates:
            - Path=/api/administracion/**
          filters:
            - AuthenticationFilter

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha

    urls:
      - name: ms-security
        url: /auth/v3/api-docs

      - name: ms-alumnos
        url: /api/alumnos/v3/api-docs

      - name: ms-cursos
        url: /api/cursos/v3/api-docs

      - name: ms-administracion
        url: /api/administracion/v3/api-docs

  enable-native-support: true

  api-docs:
    enabled: true


